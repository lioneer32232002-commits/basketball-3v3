<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3v3 街頭籃球</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#1a1a2e;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  min-height:100vh;
  font-family:'Arial Black',sans-serif;
  color:#fff; overflow:hidden;
  user-select:none;
}
#ui-top {
  display:flex; align-items:center; justify-content:space-between;
  width:900px; padding:8px 18px;
  background:rgba(0,0,0,0.65);
  border-radius:12px 12px 0 0;
  border:2px solid #f4a020; border-bottom:none;
}
.score-box { text-align:center; min-width:100px; }
.score-box .label { font-size:11px; color:#aaa; letter-spacing:2px; }
.score-box .score { font-size:40px; color:#f4a020; line-height:1; }
.score-box.enemy .score { color:#e44; }
.score-box .target { font-size:11px; color:#888; margin-top:2px; }
#mid-box { text-align:center; }
#shot-clock-display { font-size:13px; color:#f4a020; margin-top:3px; }
#goal-display { font-size:12px; color:#ccc; margin-top:2px; }
canvas {
  display:block;
  border:2px solid #f4a020; border-top:none; border-bottom:none;
  cursor:none; outline:none;
}
#ui-bottom {
  width:900px; padding:7px 16px;
  background:rgba(0,0,0,0.65);
  border-radius:0 0 12px 12px;
  border:2px solid #f4a020; border-top:1px solid #333;
  display:flex; justify-content:space-between; align-items:center;
  font-size:12px; color:#ccc;
}
#controls-hint span { margin-right:10px; }
#controls-hint b { color:#f4a020; }
.diff-btn {
  padding:4px 11px; border-radius:6px;
  border:1px solid #555; background:#222; color:#ccc;
  cursor:pointer; font-size:12px; transition:all 0.15s;
  font-family:inherit;
}
.diff-btn:hover { border-color:#f4a020; color:#f4a020; }
.diff-btn.active { background:#f4a020; color:#000; border-color:#f4a020; font-weight:bold; }

/* ── Skills UI ── */
#skills-bar {
  position:fixed;
  left: calc(50% + 455px);
  top: 50%;
  transform: translateY(-50%);
  display:none;
  flex-direction:column;
  gap:10px;
  z-index:50;
}
.skill-slot {
  width:52px; height:52px;
  border-radius:50%;
  border:3px solid #555;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  cursor:pointer; position:relative;
  transition: border-color 0.2s, box-shadow 0.2s;
  background: rgba(0,0,0,0.7);
}
.skill-slot .sk-key {
  font-size:10px; color:#888; position:absolute; top:3px;
}
.skill-slot .sk-icon { font-size:22px; line-height:1; }
.skill-slot .sk-label { font-size:8px; color:#aaa; margin-top:1px; }
.skill-slot.ready   { border-color:#fff; box-shadow: 0 0 8px rgba(255,255,255,0.3); }
.skill-slot.active  { animation: skillPulse 0.6s infinite alternate; }
.skill-slot.cooling { border-color:#333; }
.skill-slot .sk-cd {
  position:absolute; inset:0; border-radius:50%;
  background: conic-gradient(transparent var(--pct), rgba(0,0,0,0.65) var(--pct));
}
@keyframes skillPulse {
  from { transform: scale(1); }
  to   { transform: scale(1.12); }
}
#skill-y { border-color: #f4e020; }
#skill-y.ready  { box-shadow: 0 0 12px #f4e020; }
#skill-y.active { border-color: #ffe000; box-shadow: 0 0 20px #ffe000; }
#skill-g { border-color: #20e860; }
#skill-g.ready  { box-shadow: 0 0 12px #20e860; }
#skill-g.active { border-color: #00ff60; box-shadow: 0 0 20px #00ff60; }
#skill-p { border-color: #a020f0; }
#skill-p.ready  { box-shadow: 0 0 12px #a020f0; }
#skill-p.active { border-color: #c050ff; box-shadow: 0 0 20px #c050ff; }

/* ── Overlay ── */
#overlay {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.88);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; z-index:100;
}
#overlay h1 { font-size:52px; color:#f4a020; text-shadow:0 0 24px #f4a020; margin-bottom:6px; }
#overlay h2 { font-size:22px; color:#fff; margin-bottom:28px; }
.row-opts { display:flex; gap:8px; margin-bottom:14px; align-items:center; }
.row-opts span { font-size:13px; color:#888; margin-right:4px; }
.big-score { font-size:64px; color:#fff; margin-bottom:20px; }
.big-score .s1 { color:#f4a020; }
.big-score .s2 { color:#e44; }
.menu-btn {
  padding:12px 42px; font-size:18px; border-radius:10px;
  border:2px solid #f4a020; background:transparent; color:#f4a020;
  cursor:pointer; margin:6px; font-family:inherit; font-weight:bold;
  transition:all 0.2s; letter-spacing:1px;
}
.menu-btn:hover { background:#f4a020; color:#000; }

/* ── Message ── */
#msg {
  position:fixed; top:115px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.88); padding:8px 28px; border-radius:20px;
  border:2px solid #f4a020; font-size:20px; color:#f4a020; font-weight:bold;
  z-index:50; pointer-events:none; opacity:0; transition:opacity 0.3s;
  white-space:nowrap;
}

/* ── Power bar ── */
#pw-wrap {
  position:fixed; left:50%; transform:translateX(-50%); bottom:135px;
  width:170px; display:none; flex-direction:column; align-items:center; z-index:50;
}
#pw-label { font-size:12px; color:#f4a020; margin-bottom:4px; }
#pw-bg { width:170px; height:15px; background:#333; border-radius:8px; border:1px solid #555; overflow:hidden; }
#pw-fill { height:100%; background:linear-gradient(90deg,#4ef,#f4a020,#e44); width:0%; border-radius:8px; }

</style>
</head>
<body>

<div id="ui-top">
  <div class="score-box">
    <div class="label">我方</div>
    <div class="score" id="sp">0</div>
    <div class="target" id="tp"></div>
  </div>
  <div id="mid-box">
    <div style="font-size:11px;color:#aaa;text-align:center;">投籃時限</div>
    <div style="font-size:30px;color:#fff;text-align:center;line-height:1" id="sc">24</div>
    <div id="goal-display"></div>
  </div>
  <div class="score-box enemy">
    <div class="label">對手</div>
    <div class="score" id="se">0</div>
    <div class="target" id="te"></div>
  </div>
</div>

<canvas id="c" width="900" height="520" tabindex="0"></canvas>

<div id="ui-bottom">
  <div id="controls-hint">
    <span><b>WASD</b> 移動</span>
    <span><b>J</b> 投籃</span>
    <span><b>K</b> 傳球/換人</span>
    <span><b>L</b> 搶斷</span>
    <span><b style="color:#ffe000">1</b> 三分必進</span>
    <span><b style="color:#00ff60">2</b> 兩分必進</span>
    <span><b style="color:#c050ff">3</b> 自動搶板</span>
  </div>
  <div style="display:flex;gap:6px;align-items:center">
    <span style="font-size:11px;color:#888">難度：</span>
    <button class="diff-btn active" data-diff="easy">簡單</button>
    <button class="diff-btn" data-diff="medium">中度</button>
    <button class="diff-btn" data-diff="hard">困難</button>
  </div>
</div>

<div id="msg"></div>

<!-- Skills Bar -->
<div id="skills-bar">
  <div class="skill-slot cooling" id="skill-y">
    <span class="sk-key">1</span>
    <span class="sk-icon">🟡</span>
    <span class="sk-label">必進三分</span>
    <div class="sk-cd" id="sk-cd-y"></div>
  </div>
  <div class="skill-slot cooling" id="skill-g">
    <span class="sk-key">2</span>
    <span class="sk-icon">🟢</span>
    <span class="sk-label">必進兩分</span>
    <div class="sk-cd" id="sk-cd-g"></div>
  </div>
  <div class="skill-slot cooling" id="skill-p">
    <span class="sk-key">3</span>
    <span class="sk-icon">🟣</span>
    <span class="sk-label">自動搶板</span>
    <div class="sk-cd" id="sk-cd-p"></div>
  </div>
</div>

<div id="pw-wrap"><div id="pw-label">投籃力道</div><div id="pw-bg"><div id="pw-fill"></div></div></div>

<!-- ── Main Menu ── -->
<div id="overlay">
  <h1>🏀 3v3</h1>
  <h2>街頭籃球</h2>
  <div class="row-opts">
    <span>目標分數：</span>
    <button class="diff-btn active" data-goal="5">先得5分</button>
    <button class="diff-btn" data-goal="8">先得8分</button>
  </div>
  <div class="row-opts">
    <span>難度：</span>
    <button class="diff-btn active" data-diff2="easy">簡單</button>
    <button class="diff-btn" data-diff2="medium">中度</button>
    <button class="diff-btn" data-diff2="hard">困難</button>
  </div>
  <div class="row-opts" style="flex-direction:column;align-items:center;gap:8px;margin-bottom:4px;">
    <span style="font-size:14px;color:#ccc;letter-spacing:1px;">選擇本局技能（只能選一個）</span>
    <div style="display:flex;gap:12px;">
      <button class="skill-pick active" data-sk="y" style="background:rgba(255,224,0,0.15);border:2px solid #ffe000;color:#ffe000;padding:10px 16px;border-radius:10px;cursor:pointer;font-size:13px;font-family:inherit;">🟡 三分必進</button>
      <button class="skill-pick" data-sk="g" style="background:rgba(0,255,96,0.08);border:2px solid #444;color:#888;padding:10px 16px;border-radius:10px;cursor:pointer;font-size:13px;font-family:inherit;">🟢 兩分必進</button>
      <button class="skill-pick" data-sk="p" style="background:rgba(160,32,240,0.08);border:2px solid #444;color:#888;padding:10px 16px;border-radius:10px;cursor:pointer;font-size:13px;font-family:inherit;">🟣 自動搶板</button>
    </div>
  </div>
  <button class="menu-btn" id="start-btn">開始遊戲</button>
</div>

<script>
// ═══════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════
const CW = 900, CH = 520;
const HOOP_R = 18;
const HOOP_L   = { x: 68,      y: CH/2 };
const HOOP_R_P = { x: CW - 68, y: CH/2 };

const DIFF = {
  easy:   { spd:1.9, shotAcc:0.50, defR:85,  react:0.9,  stealChance:0.18, shootDist:155 },
  medium: { spd:2.5, shotAcc:0.66, defR:110, react:0.55, stealChance:0.28, shootDist:185 },
  hard:   { spd:3.2, shotAcc:0.83, defR:140, react:0.28, stealChance:0.42, shootDist:225 },
};

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

let difficulty   = 'easy';
let cfg          = DIFF[difficulty];
let goalScore    = 5;

let gameRunning  = false;
let pScore = 0, eScore = 0;
let shotClock    = 24;
let lastTime     = 0, animId = null;
let lastTouchTeam = 'player'; // track who last possessed ball (for OOB)

// Ball
let ball = { x:CW/2, y:CH/2, z:0, vx:0, vy:0, vz:0,
             _passTarget:null, _flightLeft:0, _flight:0, targetHoop:null };
let ballHolder = null;   // { team, idx }
let ballInAir  = false;
let ballFree   = false;

// Shooting power
let chargingShot = false, shootPow = 0, powDir = 1;

// Controls
const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true;  onKeyDown(e); });
window.addEventListener('keyup',   e => { keys[e.key.toLowerCase()] = false; onKeyUp(e);   });

// Players array: [p0,p1,p2, e0,e1,e2]
let players = [];
let ctrlIdx = 0;  // which player index (0-2) user controls

// Enemy AI timer
let eAiT = 0;
// Teammate AI timers per player
let tmAiT = [0, 0, 0];

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
function mkPlayer(x, y, team, idx) {
  return { x, y, team, idx, radius:16,
           color: team==='player' ? '#27ae60' : '#e74c3c',
           number: idx+1,
           stealCd:0  // per-player steal cooldown (for enemy AI)
         };
}

function initPlayers() {
  players = [
    mkPlayer(220, CH/2,      'player', 0),
    mkPlayer(200, CH/2-90,   'player', 1),
    mkPlayer(200, CH/2+90,   'player', 2),
    mkPlayer(680, CH/2,      'enemy',  0),
    mkPlayer(700, CH/2-90,   'enemy',  1),
    mkPlayer(700, CH/2+90,   'enemy',  2),
  ];
  ballHolder = { team:'player', idx:0 };
  ballInAir = false; ballFree = false;
  ball.x = players[0].x; ball.y = players[0].y; ball.z = 0;
  ball._passTarget = null; ball.targetHoop = null; ball._flightLeft = 0;
  ctrlIdx = 0;
}

// ═══════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════
const dist  = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));

function getP(ref) {
  if (!ref) return null;
  return players[ref.team==='player' ? ref.idx : ref.idx+3];
}
function atkHoop(team)  { return team==='player' ? HOOP_R_P : HOOP_L; }
function defHoop(team)  { return team==='player' ? HOOP_L   : HOOP_R_P; }
function is3pt(x, y, team) { return dist({x,y}, atkHoop(team)) > 195; }

function shotAcc(d, team) {
  const base = team==='player' ? 0.78 : cfg.shotAcc;
  return clamp(base - Math.max(0,(d-100)/420), 0.10, 0.97);
}

function moveToward(p, t, spd) {
  const dx=t.x-p.x, dy=t.y-p.y, d=Math.hypot(dx,dy);
  if (d<1) return;
  p.x = clamp(p.x+(dx/d)*spd, 20, CW-20);
  p.y = clamp(p.y+(dy/d)*spd, 20, CH-20);
}

// ═══════════════════════════════════════════════════════
// DRAW COURT
// ═══════════════════════════════════════════════════════
function drawCourt() {
  ctx.fillStyle = '#c8832a';
  ctx.fillRect(0,0,CW,CH);

  ctx.strokeStyle='#fff'; ctx.lineWidth=3;
  ctx.strokeRect(8,8,CW-16,CH-16);

  ctx.beginPath(); ctx.moveTo(CW/2,8); ctx.lineTo(CW/2,CH-8); ctx.stroke();
  ctx.beginPath(); ctx.arc(CW/2,CH/2,55,0,Math.PI*2); ctx.stroke();

  // Left paint
  ctx.fillStyle='rgba(200,50,50,0.22)';
  ctx.fillRect(8,CH/2-80,160,160);
  ctx.strokeStyle='#fff'; ctx.lineWidth=2;
  ctx.strokeRect(8,CH/2-80,160,160);

  // Right paint
  ctx.fillStyle='rgba(50,80,200,0.18)';
  ctx.fillRect(CW-168,CH/2-80,160,160);
  ctx.strokeRect(CW-168,CH/2-80,160,160);

  // Left 3pt
  ctx.beginPath();
  ctx.arc(HOOP_L.x, HOOP_L.y, 195, -Math.PI*0.68, Math.PI*0.68);
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();

  // Right 3pt
  ctx.beginPath();
  ctx.arc(HOOP_R_P.x, HOOP_R_P.y, 195, Math.PI*0.32, Math.PI*1.68);
  ctx.stroke();

  drawHoop(HOOP_L);
  drawHoop(HOOP_R_P);
}

function drawHoop(h) {
  const left = h.x < CW/2;
  ctx.fillStyle='#ddd';
  ctx.fillRect(left ? h.x-16 : h.x+12, h.y-26, 4, 52);

  ctx.beginPath(); ctx.arc(h.x,h.y,HOOP_R,0,Math.PI*2);
  ctx.strokeStyle='#e44'; ctx.lineWidth=3; ctx.stroke();

  ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1;
  for (let a=0;a<8;a++) {
    const ag=a/8*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(h.x+Math.cos(ag)*HOOP_R, h.y+Math.sin(ag)*HOOP_R);
    ctx.lineTo(h.x+Math.cos(ag)*7,       h.y+Math.sin(ag)*7+18);
    ctx.stroke();
  }
}

// ═══════════════════════════════════════════════════════
// DRAW PLAYERS
// ═══════════════════════════════════════════════════════
function drawPlayers() {
  for (let i=0;i<players.length;i++) {
    const p = players[i];
    const isCtrl = (p.team==='player' && i===ctrlIdx);
    const hasBall= ballHolder && ballHolder.team===p.team && ballHolder.idx===p.idx;

    // Shadow
    ctx.beginPath();
    ctx.ellipse(p.x, p.y+p.radius-2, p.radius, 6, 0, 0, Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.fill();

    // Body
    ctx.beginPath(); ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
    ctx.fillStyle = p.color; ctx.fill();

    // Controlled ring
    if (isCtrl) {
      ctx.beginPath(); ctx.arc(p.x,p.y,p.radius+4,0,Math.PI*2);
      ctx.strokeStyle='#ffe040'; ctx.lineWidth=2.5; ctx.stroke();
    }

    // Number
    ctx.fillStyle='#fff'; ctx.font=`bold ${p.radius}px Arial`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(p.number, p.x, p.y);

    // Ball dot above head
    if (hasBall && !ballInAir) {
      ctx.fillStyle='#f4a020';
      ctx.beginPath(); ctx.arc(p.x, p.y-p.radius-8, 6, 0, Math.PI*2); ctx.fill();
    }

  }
}

// ═══════════════════════════════════════════════════════
// DRAW BALL
// ═══════════════════════════════════════════════════════
function drawBall() {
  if (!ballInAir && !ballFree && ballHolder) return;
  const bz=ball.z, scale=1+bz*0.018, r=9*scale;
  ctx.beginPath();
  ctx.ellipse(ball.x, ball.y+10, r*1.2, r*0.4, 0, 0, Math.PI*2);
  ctx.fillStyle=`rgba(0,0,0,${0.35-bz*0.007})`; ctx.fill();

  ctx.beginPath(); ctx.arc(ball.x, ball.y-bz*0.5, r, 0, Math.PI*2);
  const g=ctx.createRadialGradient(ball.x-r*0.3,ball.y-bz*0.5-r*0.3,r*0.1,ball.x,ball.y-bz*0.5,r);
  g.addColorStop(0,'#f9c74f'); g.addColorStop(0.6,'#f4a020'); g.addColorStop(1,'#c07010');
  ctx.fillStyle=g; ctx.fill();

  ctx.strokeStyle='rgba(0,0,0,0.4)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(ball.x,ball.y-bz*0.5,r,-0.4,Math.PI+0.4); ctx.stroke();
}

// ═══════════════════════════════════════════════════════
// DRAW PASS ARROW
// ═══════════════════════════════════════════════════════
function drawPassArrow() {
  if (!ballHolder || ballHolder.team!=='player') return;
  const h = getP(ballHolder); if (!h) return;
  let best=-1, bestD=9999;
  for (let i=0;i<3;i++) {
    if (i===ctrlIdx) continue;
    const d=dist(h,players[i]);
    if (d<bestD) { bestD=d; best=i; }
  }
  if (best<0) return;
  const tp=players[best];
  ctx.save(); ctx.setLineDash([6,4]);
  ctx.strokeStyle='rgba(255,255,80,0.55)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(h.x,h.y); ctx.lineTo(tp.x,tp.y); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();
}

// ═══════════════════════════════════════════════════════
// SHOOTING
// ═══════════════════════════════════════════════════════
function shootBall(ref, pow) {
  lastTouchTeam = ref.team;
  const sh    = getP(ref);
  const hoop  = atkHoop(ref.team);
  const d     = dist(sh, hoop);
  const three = is3pt(sh.x, sh.y, ref.team);
  const acc   = shotAcc(d, ref.team);
  const powErr = Math.abs(pow/100 - 0.65) * 0.55;
  let made = Math.random() < clamp(acc - powErr, 0.04, 0.97);

  // ── 技能判定 ──
  if (ref.team === 'player') {
    if (skills.y.active && three)  { made = true; consumeSkill('y'); }
    if (skills.g.active && !three) { made = true; consumeSkill('g'); }
    // 若啟動了不對應的技能，不消耗（讓玩家繼續持有）
  }

  ballHolder=null; ballFree=false; ballInAir=true;
  ball.x=sh.x; ball.y=sh.y; ball.z=0;

  if (made) {
    ball.targetHoop = { x:hoop.x, y:hoop.y, made:true, shooter:{...ref} };
  } else {
    const ang = Math.atan2(hoop.y-sh.y, hoop.x-sh.x);
    const off = (Math.random()-0.5)*90;
    ball.targetHoop = {
      x: hoop.x + Math.cos(ang+Math.PI/2)*off,
      y: hoop.y + Math.sin(ang+Math.PI/2)*off + (Math.random()-0.5)*40,
      made:false, shooter:{...ref}
    };
  }
  const dx=ball.targetHoop.x-ball.x, dy=ball.targetHoop.y-ball.y;
  const tf=38;
  ball.vx=dx/tf; ball.vy=dy/tf; ball.vz=14;
  ball._flight=tf; ball._flightLeft=tf;
  ball._passTarget=null;
  chargingShot=false; shootPow=0;
}

function passBall(fromRef, toGlobalIdx) {
  const from=getP(fromRef), to=players[toGlobalIdx];
  if (!from||!to) return;
  ballHolder=null; ballFree=false; ballInAir=true;
  ball.x=from.x; ball.y=from.y; ball.z=0;
  const dx=to.x-from.x, dy=to.y-from.y, d=Math.hypot(dx,dy);
  const spd=9;
  ball.vx=dx/d*spd; ball.vy=dy/d*spd; ball.vz=3;
  ball._passTarget = { team:fromRef.team, idx:toGlobalIdx%3 };
  ball._flightLeft=-1; ball._flight=-1; ball.targetHoop=null;
}

// ═══════════════════════════════════════════════════════
// BALL PHYSICS
// ═══════════════════════════════════════════════════════
function updateBall(dt) {
  if (!ballInAir) {
    if (!ballFree && ballHolder) {
      const h=getP(ballHolder);
      if (h) { ball.x=h.x; ball.y=h.y; }
    }
    return;
  }

  // Pass flight
  if (ball._passTarget) {
    ball.x+=ball.vx; ball.y+=ball.vy;
    ball.z=Math.max(0, ball.z+ball.vz); ball.vz-=0.4;

    // Out of bounds during pass → other team gets ball
    if (isOOB(ball.x, ball.y)) {
      handleOOB(ball._passTarget.team);
      return;
    }

    const tIdx = ball._passTarget.team==='player' ? ball._passTarget.idx : ball._passTarget.idx+3;
    const tgt  = players[tIdx];
    if (tgt && dist(ball,tgt)<34) {
      catchBall(ball._passTarget); ball._passTarget=null; return;
    }
    // Intercept by enemy
    for (let i=3;i<6;i++) {
      const ep=players[i];
      if (dist(ball,ep)<ep.radius+10 && ball._passTarget.team==='player') {
        catchBall({team:'enemy',idx:i-3});
        ball._passTarget=null;
        showMsg('傳球被截！','#e44');
        return;
      }
    }
    if (ball.z<0) { ball.z=0; dropBall(); }
    return;
  }

  // Shot arc
  if (ball._flightLeft>0) {
    ball.x+=ball.vx; ball.y+=ball.vy;
    ball.z+=ball.vz; ball.vz-=28/ball._flight;
    ball._flightLeft--;

    if (ball._flightLeft<=0) {
      ball.x=ball.targetHoop.x; ball.y=ball.targetHoop.y; ball.z=0;
      ballInAir=false;
      if (ball.targetHoop.made) {
        const team=ball.targetHoop.shooter.team;
        if (team==='player') { pScore++; showMsg('✅ 得分！','#f4a020'); }
        else                 { eScore++; showMsg('對手得分！','#e44'); }
        updateScoreUI();
        if (pScore>=goalScore || eScore>=goalScore) { endGame(); return; }
        resetAfterScore(team);
      } else {
        // 紫色技能：對方投籃未進 → 自動給我方最近球員
        const missTeam = ball.targetHoop.shooter.team;
        if (skills.p.active && missTeam === 'enemy') {
          // 找距離最近的我方球員
          let nearI=0, nearD=9999;
          for (let i=0;i<3;i++) {
            const d2=dist(players[i], ball);
            if (d2<nearD){ nearD=d2; nearI=i; }
          }
          catchBall({team:'player', idx:nearI});
          showMsg('🟣 自動搶板！球回到我方！','#c050ff');
          consumeSkill('p');
        } else {
          ballFree=true; ballHolder=null;
          ball.vx=(Math.random()-0.5)*3.5; ball.vy=(Math.random()-0.5)*3.5;
          showMsg('籃板！','#8cf');
        }
      }
    }
    return;
  }

  // Free ball — out of bounds rule
  if (ballFree) {
    ball.x+=ball.vx; ball.y+=ball.vy;
    ball.vx*=0.96; ball.vy*=0.96;
    if (isOOB(ball.x, ball.y)) {
      handleOOB(lastTouchTeam);
    }
  }
}

function catchBall(ref) {
  ballHolder={team:ref.team, idx:ref.idx};
  ballInAir=false; ballFree=false;
  ball._passTarget=null; ball.z=0;
  ball.vx=0; ball.vy=0;
  shotClock=24;
  lastTouchTeam=ref.team;
  if (ref.team==='player') ctrlIdx=ref.idx;
}

function dropBall() {
  ball._passTarget=null;
  ballFree=true; ballHolder=null; ballInAir=true;
  ball.vx=(Math.random()-0.5)*4; ball.vy=(Math.random()-0.5)*4;
  ball.vz=1; ball.z=0;
}

// ── Out of Bounds ──────────────────────────────────────
const OOB_X1=8, OOB_X2=CW-8, OOB_Y1=8, OOB_Y2=CH-8;
function isOOB(x, y) { return x<OOB_X1 || x>OOB_X2 || y<OOB_Y1 || y>OOB_Y2; }

function handleOOB(foulTeam) {
  // foulTeam = team that sent ball out; other team gets possession
  const getTeam = foulTeam==='player' ? 'enemy' : 'player';
  ball.x = clamp(ball.x, OOB_X1+20, OOB_X2-20);
  ball.y = clamp(ball.y, OOB_Y1+20, OOB_Y2-20);
  ball.vx=0; ball.vy=0; ball.vz=0; ball.z=0;
  ball._passTarget=null; ball._flightLeft=0;
  ballInAir=false; ballFree=false;
  ballHolder={ team:getTeam, idx:0 };
  shotClock=24;
  lastTouchTeam=getTeam;
  if (getTeam==='player') ctrlIdx=0;
  showMsg(
    getTeam==='player' ? '出界！我方拿球 🏀' : '出界！對方拿球',
    getTeam==='player' ? '#4ef' : '#e44'
  );
}

// ═══════════════════════════════════════════════════════
// PICKUP
// ═══════════════════════════════════════════════════════
function checkPickup() {
  if (!ballFree) return;
  for (let i=0;i<players.length;i++) {
    const p=players[i];
    if (dist(p,ball)<p.radius+14) {
      ballHolder={team:p.team, idx:p.idx};
      ballFree=false; ballInAir=false;
      ball.vx=0; ball.vy=0;
      if (p.team==='player') { ctrlIdx=p.idx; showMsg('搶到球！'); }
      shotClock=24; return;
    }
  }
}

// ═══════════════════════════════════════════════════════
// PLAYER MOVEMENT (user-controlled)
// ═══════════════════════════════════════════════════════
function updatePlayerMovement() {
  const p=players[ctrlIdx];
  let dx=0,dy=0;
  if (keys['w']||keys['arrowup'])    dy-=1;
  if (keys['s']||keys['arrowdown'])  dy+=1;
  if (keys['a']||keys['arrowleft'])  dx-=1;
  if (keys['d']||keys['arrowright']) dx+=1;
  if (dx||dy) {
    const len=Math.hypot(dx,dy);
    p.x=clamp(p.x+(dx/len)*3.0, 20, CW-20);
    p.y=clamp(p.y+(dy/len)*3.0, 20, CH-20);
  }
}

// ═══════════════════════════════════════════════════════
// TEAMMATE AI (full AI when not controlled)
// ═══════════════════════════════════════════════════════
function updateTeammateAI(dt) {
  for (let i=0;i<3;i++) {
    if (i===ctrlIdx) continue;
    const p = players[i];
    tmAiT[i] -= dt;

    const iHaveBall = ballHolder && ballHolder.team==='player' && ballHolder.idx===i;
    const teamHasBall = ballHolder && ballHolder.team==='player';
    const enemyHasBall = ballHolder && ballHolder.team==='enemy';

    if (iHaveBall) {
      // I have ball: move toward hoop, shoot if in range, pass if pressured
      const hoop = atkHoop('player');
      const d    = dist(p, hoop);
      const nearEnemy = closestTo(p,'enemy');
      const pressure  = nearEnemy && dist(p,nearEnemy) < 55;

      if (pressure && tmAiT[i]<=0) {
        // Pass to teammate further from pressure
        const mate = bestPassFor('player', i);
        if (mate>=0) { passBall({team:'player',idx:i}, mate); tmAiT[i]=0.8; return; }
      }
      if (d < 170 && tmAiT[i]<=0) {
        shootBall({team:'player',idx:i}, 65);
        tmAiT[i] = 1.2;
        return;
      }
      moveToward(p, hoop, 2.0);

    } else if (teamHasBall) {
      // Teammate has ball: cut toward open spots around the paint
      const offPos = [
        { x:600, y:CH/2-130 },
        { x:620, y:CH/2+130 },
        { x:680, y:CH/2 },
      ];
      const t = offPos[i % offPos.length];
      moveToward(p, t, 2.0);

    } else if (enemyHasBall) {
      // Defense: mark nearest enemy player
      const marks = [3, 4, 5];
      const markP = players[marks[i]];
      if (markP) {
        const tgt = { x: markP.x + (p.x>markP.x ? 28:-28), y: markP.y };
        moveToward(p, tgt, 2.2);
        // Teammate steal attempt
        if (dist(p, markP) < 32 && tmAiT[i]<=0 && ballHolder && ballHolder.team==='enemy' && ballHolder.idx===marks[i]-3) {
          if (Math.random() < 0.15) {
            dropBall();
            showMsg('隊友抄球！','#4ef');
          }
          tmAiT[i]=1.5;
        }
      }

    } else {
      // Ball free: go chase it
      if (ballFree) moveToward(p, ball, 2.2);
      else {
        // Return to default spread
        const def = [{x:300,y:CH/2},{x:260,y:CH/2-100},{x:260,y:CH/2+100}];
        moveToward(p, def[i], 1.8);
      }
    }
  }
}

function closestTo(p, team) {
  let best=null, bestD=9999;
  const off=team==='player'?0:3;
  for (let i=0;i<3;i++) {
    const d=dist(p,players[off+i]);
    if (d<bestD){bestD=d;best=players[off+i];}
  }
  return best;
}

function bestPassFor(team, selfIdx) {
  let best=-1, bestS=-1;
  const off = team==='player' ? 0 : 3;
  for (let i=0;i<3;i++) {
    if (i===selfIdx) continue;
    const p    = players[off+i];
    const hoop = atkHoop(team);
    const s    = 1000 - dist(p, hoop);
    if (s>bestS) { bestS=s; best=off+i; }
  }
  return best;
}

// ═══════════════════════════════════════════════════════
// ENEMY AI
// ═══════════════════════════════════════════════════════
function updateEnemyAI(dt) {
  eAiT -= dt;
  const spd = cfg.spd;
  let carrier = (ballHolder && ballHolder.team==='enemy') ? ballHolder.idx : -1;

  for (let i=0;i<3;i++) {
    const p = players[3+i];
    p.stealCd = Math.max(0, (p.stealCd||0)-dt);

    if (i===carrier) {
      // Has ball: drive to hoop or pass
      const hoop = atkHoop('enemy');
      const d    = dist(p, hoop);
      const near = closestTo(p,'player');
      const pressured = near && dist(p,near)<cfg.defR*0.6;

      if (pressured && eAiT<=0 && Math.random()<0.04) {
        const mate=bestPassFor('enemy',i);
        if (mate>=0){ passBall({team:'enemy',idx:i}, mate); return; }
      }
      if (d<cfg.shootDist && eAiT<=0) {
        shootBall({team:'enemy',idx:i}, 65);
        eAiT=cfg.react;
        return;
      }
      moveToward(p, hoop, spd);

    } else if (carrier>=0) {
      // Support: spread to open spots
      const spots=[{x:660,y:CH/2-120},{x:730,y:CH/2+120},{x:610,y:CH/2}];
      moveToward(p, spots[i], spd*0.85);

    } else {
      // Defense / chase
      if (ballFree) {
        moveToward(p, ball, spd);
      } else if (ballHolder && ballHolder.team==='player') {
        const mark = players[i];  // mark same-index player
        const bh   = getP(ballHolder);
        const tgt  = i===0 ? bh : mark;
        if (tgt) {
          moveToward(p, { x:tgt.x+(p.x>tgt.x?32:-32), y:tgt.y }, spd);
          // Steal attempt
          if (bh && dist(p,bh)<30 && p.stealCd<=0) {
            if (Math.random()<cfg.stealChance*dt*2.5) {
              dropBall();
              showMsg('被搶球！','#e44');
              p.stealCd=1.8;
            }
          }
        }
      }
    }
  }
  if (eAiT<=0) eAiT=cfg.react;
}

// ═══════════════════════════════════════════════════════
// SKILLS
// ═══════════════════════════════════════════════════════
const SKILL_MAX_CD = { y:18, g:18, p:22 };
const skills = {
  y: { active:false, cd:0 }, // 黃：三分必進
  g: { active:false, cd:0 }, // 綠：兩分必進
  p: { active:false, cd:0 }, // 紫：對方未進自動搶板
};
let chosenSkill = 'y'; // 本局選擇的技能

function activateSkill(id) {
  if (id !== chosenSkill) return; // 本局只能用選定的技能
  const sk = skills[id];
  if (sk.cd > 0)  { showMsg('技能冷卻中…', '#888'); return; }
  if (sk.active)  { showMsg('技能已啟動！', '#888'); return; }
  const names = { y:'🟡 三分必進！', g:'🟢 兩分必進！', p:'🟣 自動搶板！' };
  const cols  = { y:'#ffe000', g:'#00ff60', p:'#c050ff' };
  sk.active = true;
  showMsg(names[id], cols[id]);
  updateSkillUI();
}

function consumeSkill(id) {
  skills[id].active = false;
  skills[id].cd = SKILL_MAX_CD[id];
  updateSkillUI();
}

function updateSkillUI() {
  ['y','g','p'].forEach(id => {
    const slot = document.getElementById('skill-'+id);
    const cov  = document.getElementById('sk-cd-'+id);
    const sk   = skills[id];
    // 只顯示本局選定的技能
    slot.style.display = (id === chosenSkill) ? 'flex' : 'none';
    slot.classList.remove('ready','active','cooling');
    if (sk.active) {
      slot.classList.add('active');
      cov.style.setProperty('--pct','0deg');
    } else if (sk.cd > 0) {
      slot.classList.add('cooling');
      const pct = (sk.cd / SKILL_MAX_CD[id]) * 360;
      cov.style.setProperty('--pct', pct+'deg');
    } else {
      slot.classList.add('ready');
      cov.style.setProperty('--pct','0deg');
    }
  });
}

function updateSkillCooldowns(dt) {
  let changed = false;
  ['y','g','p'].forEach(id => {
    if (skills[id].cd > 0) {
      skills[id].cd = Math.max(0, skills[id].cd - dt);
      changed = true;
    }
  });
  if (changed) updateSkillUI();
}

// ═══════════════════════════════════════════════════════
// L — STEAL
// ═══════════════════════════════════════════════════════
let stealCdPlayer = 0;

function doSteal() {
  if (stealCdPlayer > 0) { showMsg(`搶斷冷卻中…`, '#888'); return; }
  const me = players[ctrlIdx];
  if (ballHolder && ballHolder.team === 'enemy') {
    const bh = getP(ballHolder);
    if (bh && dist(me, bh) < 42) {
      const chance = 0.55 - (dist(me, bh) / 42) * 0.2;
      if (Math.random() < chance) {
        dropBall();
        showMsg('🔥 搶斷成功！', '#4ef');
      } else {
        showMsg('搶斷失敗', '#888');
      }
    } else {
      showMsg('距離太遠', '#888');
    }
  } else if (ballInAir && ball._passTarget && ball._passTarget.team === 'enemy') {
    // Intercept enemy pass
    const d = dist(me, ball);
    if (d < 50) {
      catchBall({ team: 'player', idx: ctrlIdx });
      showMsg('🔥 截球！', '#4ef');
    } else {
      showMsg('沒截到', '#888');
    }
  } else {
    showMsg('沒有可搶的球', '#888');
  }
  stealCdPlayer = 1.5;
}

// ═══════════════════════════════════════════════════════
// KEY HANDLERS
// ═══════════════════════════════════════════════════════
function onKeyDown(e) {
  if (!gameRunning) return;
  const k = e.key.toLowerCase();
  if (['j','k','l'].includes(k)) e.preventDefault();

  // J — shoot (start charging)
  if (k==='j') {
    if (ballHolder && ballHolder.team==='player' && ballHolder.idx===ctrlIdx) {
      chargingShot=true; shootPow=0; powDir=1;
    }
  }

  // K — context: holding ball → pass; no ball → switch player
  if (k==='k') {
    const iHaveBall = ballHolder && ballHolder.team==='player' && ballHolder.idx===ctrlIdx;
    if (iHaveBall) {
      const mate = bestPassFor('player', ctrlIdx);
      if (mate>=0) { passBall(ballHolder, mate); showMsg('傳球！'); }
    } else {
      let bestI=ctrlIdx, bestD=9999;
      for (let i=0;i<3;i++) {
        if (i===ctrlIdx) continue;
        const ref=ballFree?ball:(getP(ballHolder)||ball);
        const d=dist(players[i], ref);
        if (d<bestD){ bestD=d; bestI=i; }
      }
      ctrlIdx=bestI;
    }
  }

  // L — steal
  if (k==='l') doSteal();

  // 1/2/3 — skills
  if (k==='1') activateSkill('y');
  if (k==='2') activateSkill('g');
  if (k==='3') activateSkill('p');
}

function onKeyUp(e) {
  const k=e.key.toLowerCase();
  if (k==='j' && chargingShot) {
    chargingShot=false;
    if (ballHolder && ballHolder.team==='player' && ballHolder.idx===ctrlIdx) {
      shootBall(ballHolder, shootPow);
    }
    shootPow=0;
    document.getElementById('pw-wrap').style.display='none';
  }
}

// ═══════════════════════════════════════════════════════
// SHOT CLOCK
// ═══════════════════════════════════════════════════════
function updateShotClock(dt) {
  if (!ballHolder) return;
  shotClock -= dt;
  if (shotClock<=0) {
    shotClock=24;
    showMsg('投籃時限！換球！','#e44');
    const loser = ballHolder.team;
    dropBall();
    ball.vx = loser==='player' ? 3 : -3;
  }
}

// ═══════════════════════════════════════════════════════
// AFTER SCORE RESET
// ═══════════════════════════════════════════════════════
function resetAfterScore(scorerTeam) {
  ballFree=false; ballInAir=false;
  ball.z=0; ball.vx=0; ball.vy=0; ball.vz=0;
  ball.targetHoop=null; ball._passTarget=null; ball._flightLeft=0;
  const inTeam = scorerTeam==='player' ? 'enemy' : 'player';
  const hoop   = defHoop(inTeam);
  ball.x = hoop.x + (inTeam==='player' ? 80 : -80);
  ball.y = hoop.y;
  ballHolder = { team:inTeam, idx:0 };
  if (inTeam==='player') ctrlIdx=0;
  shotClock=24;
  const pPos=[{x:250,y:CH/2},{x:220,y:CH/2-90},{x:220,y:CH/2+90}];
  const ePos=[{x:650,y:CH/2},{x:680,y:CH/2-90},{x:680,y:CH/2+90}];
  for (let i=0;i<3;i++) {
    players[i].x=pPos[i].x; players[i].y=pPos[i].y;
    players[3+i].x=ePos[i].x; players[3+i].y=ePos[i].y;
  }
}

// ═══════════════════════════════════════════════════════
// POWER CHARGE
// ═══════════════════════════════════════════════════════
function updatePowerCharge(dt) {
  if (!chargingShot) return;
  shootPow += powDir*dt*85;
  if (shootPow>=100){ shootPow=100; powDir=-1; }
  if (shootPow<=0)  { shootPow=0;   powDir=1;  }
  document.getElementById('pw-wrap').style.display='flex';
  document.getElementById('pw-fill').style.width=shootPow+'%';
}

  document.getElementById('sp').textContent=pScore;

      <div style="display:flex;gap:12px;">
        <button class="skill-pick${chosenSkill==='y'?' sk-sel':''}" data-sk="y" style="border:2px solid ${chosenSkill==='y'?'#ffe000':'#444'};color:${chosenSkill==='y'?'#ffe000':'#888'};background:${chosenSkill==='y'?'rgba(255,224,0,0.15)':'transparent'};padding:8px 14px;border-radius:10px;cursor:pointer;font-size:12px;font-family:inherit;">🟡 三分必進</button>
        <button class="skill-pick${chosenSkill==='g'?' sk-sel':''}" data-sk="g" style="border:2px solid ${chosenSkill==='g'?'#00ff60':'#444'};color:${chosenSkill==='g'?'#00ff60':'#888'};background:${chosenSkill==='g'?'rgba(0,255,96,0.08)':'transparent'};padding:8px 14px;border-radius:10px;cursor:pointer;font-size:12px;font-family:inherit;">🟢 兩分必進</button>
        <button class="skill-pick${chosenSkill==='p'?' sk-sel':''}" data-sk="p" style="border:2px solid ${chosenSkill==='p'?'#c050ff':'#444'};color:${chosenSkill==='p'?'#c050ff':'#888'};background:${chosenSkill==='p'?'rgba(160,32,240,0.15)':'transparent'};padding:8px 14px;border-radius:10px;cursor:pointer;font-size:12px;font-family:inherit;">🟣 自動搶板</button>
      </div>
    </div>
    <button class="menu-btn" id="start-btn">再玩一局</button>`;
  ov.style.display='flex';
  bindOverlay();
}

// ═══════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════
function loop(ts) {
  if (!gameRunning) return;
  const dt=Math.min((ts-lastTime)/1000, 0.05);
  lastTime=ts;

  updateShotClock(dt);
  updateShotClockUI();
  updatePlayerMovement();
  updateTeammateAI(dt);
  updateEnemyAI(dt);
  updateBall(dt);
  updatePowerCharge(dt);
  stealCdPlayer = Math.max(0, stealCdPlayer - dt);
  updateSkillCooldowns(dt);
  checkPickup();

  ctx.clearRect(0,0,CW,CH);
  drawCourt();
  drawPassArrow();
  drawPlayers();
  drawBall();

  animId=requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════
// START
// ═══════════════════════════════════════════════════════
function startGame() {
  pScore=0; eScore=0; shotClock=24;
  chargingShot=false; shootPow=0; stealCdPlayer=0; lastTouchTeam='player';
  ['y','g','p'].forEach(id=>{ skills[id].active=false; skills[id].cd=0; });
  updateSkillUI();
  ballInAir=false; ballFree=false;
  cfg=DIFF[difficulty];
  tmAiT=[0,0,0]; eAiT=0;
  initPlayers();
  updateScoreUI();
  document.getElementById('overlay').style.display='none';
  document.getElementById('skills-bar').style.display='flex';
  gameRunning=true;
  lastTime=performance.now();
  animId=requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════
// BUTTON BINDINGS
// ═══════════════════════════════════════════════════════
function bindOverlay() {
  document.querySelectorAll('[data-goal]').forEach(b=>{
    b.addEventListener('click',()=>{
      goalScore=parseInt(b.dataset.goal);
      document.querySelectorAll('[data-goal]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
    });
  });
  document.querySelectorAll('[data-diff2]').forEach(b=>{
    b.addEventListener('click',()=>{
      difficulty=b.dataset.diff2; cfg=DIFF[difficulty];
      document.querySelectorAll('[data-diff2]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
    });
  });
  // 技能選擇
  const skColors = { y:'#ffe000', g:'#00ff60', p:'#c050ff' };
  const skBg     = { y:'rgba(255,224,0,0.15)', g:'rgba(0,255,96,0.08)', p:'rgba(160,32,240,0.15)' };
  document.querySelectorAll('[data-sk]').forEach(b=>{
    b.addEventListener('click',()=>{
      chosenSkill = b.dataset.sk;
      document.querySelectorAll('[data-sk]').forEach(x=>{
        x.style.borderColor='#444'; x.style.color='#888'; x.style.background='transparent';
      });
      b.style.borderColor = skColors[chosenSkill];
      b.style.color       = skColors[chosenSkill];
      b.style.background  = skBg[chosenSkill];
    });
  });
  const sb=document.getElementById('start-btn');
  if (sb) sb.addEventListener('click', startGame);
}

document.querySelectorAll('[data-diff]').forEach(b=>{
  b.addEventListener('click',()=>{
    difficulty=b.dataset.diff; cfg=DIFF[difficulty];
    document.querySelectorAll('[data-diff]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  });
});

bindOverlay();
drawCourt();
</script>
</body>
</html>
