<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3v3 街頭籃球</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Arial Black', sans-serif;
    color: #fff;
    overflow: hidden;
  }
  #ui-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 900px;
    padding: 8px 16px;
    background: rgba(0,0,0,0.6);
    border-radius: 12px 12px 0 0;
    border: 2px solid #f4a020;
    border-bottom: none;
  }
  .score-box { text-align: center; }
  .score-box .label { font-size: 12px; color: #aaa; letter-spacing: 2px; }
  .score-box .score { font-size: 36px; color: #f4a020; line-height: 1; }
  .score-box.enemy .score { color: #e44; }
  #timer-box { text-align: center; }
  #timer-box .label { font-size: 11px; color: #aaa; }
  #timer-box .time { font-size: 28px; color: #fff; }
  #shot-clock { font-size: 13px; color: #f4a020; text-align:center; margin-top:2px; }
  #quarter-box { font-size: 13px; color: #ccc; text-align:center; }
  canvas {
    display: block;
    border: 2px solid #f4a020;
    border-top: none;
    border-bottom: none;
    cursor: none;
  }
  #ui-bottom {
    width: 900px;
    padding: 8px 16px;
    background: rgba(0,0,0,0.6);
    border-radius: 0 0 12px 12px;
    border: 2px solid #f4a020;
    border-top: 1px solid #444;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #ccc;
  }
  #controls-hint span { margin-right: 12px; }
  #controls-hint b { color: #f4a020; }
  #diff-box { display: flex; gap: 8px; align-items: center; }
  #diff-box span { font-size: 12px; color: #888; }
  .diff-btn {
    padding: 4px 12px;
    border-radius: 6px;
    border: 1px solid #555;
    background: #222;
    color: #ccc;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.2s;
  }
  .diff-btn:hover { border-color: #f4a020; color: #f4a020; }
  .diff-btn.active { background: #f4a020; color: #000; border-color: #f4a020; font-weight: bold; }

  /* Overlay screens */
  #overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100;
  }
  #overlay h1 { font-size: 48px; color: #f4a020; text-shadow: 0 0 20px #f4a020; margin-bottom: 8px; }
  #overlay h2 { font-size: 24px; color: #fff; margin-bottom: 32px; }
  #overlay .big-score { font-size: 64px; color: #fff; margin-bottom: 24px; }
  #overlay .big-score .s1 { color: #f4a020; }
  #overlay .big-score .s2 { color: #e44; }
  .menu-btn {
    padding: 12px 40px;
    font-size: 18px;
    border-radius: 10px;
    border: 2px solid #f4a020;
    background: transparent;
    color: #f4a020;
    cursor: pointer;
    margin: 6px;
    font-family: inherit;
    font-weight: bold;
    transition: all 0.2s;
    letter-spacing: 1px;
  }
  .menu-btn:hover { background: #f4a020; color: #000; }
  #message-box {
    position: fixed;
    top: 120px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    padding: 10px 30px;
    border-radius: 20px;
    border: 2px solid #f4a020;
    font-size: 20px;
    color: #f4a020;
    font-weight: bold;
    z-index: 50;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #power-bar-wrap {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 140px;
    width: 160px;
    display: none;
    flex-direction: column;
    align-items: center;
    z-index: 50;
  }
  #power-label { font-size: 13px; color: #f4a020; margin-bottom: 4px; }
  #power-bar-bg {
    width: 160px; height: 16px;
    background: #333;
    border-radius: 8px;
    border: 1px solid #555;
    overflow: hidden;
  }
  #power-bar {
    height: 100%;
    background: linear-gradient(90deg, #4ef, #f4a020, #e44);
    width: 0%;
    border-radius: 8px;
    transition: width 0.05s;
  }
</style>
</head>
<body>

<div id="ui-top">
  <div class="score-box">
    <div class="label">我方</div>
    <div class="score" id="score-player">0</div>
  </div>
  <div>
    <div id="timer-box">
      <div class="label">剩餘時間</div>
      <div class="time" id="timer">3:00</div>
    </div>
    <div id="shot-clock">投籃時限: <span id="shot-num">24</span>s</div>
    <div id="quarter-box" style="display:none"></div>
  </div>
  <div class="score-box enemy">
    <div class="label">對手</div>
    <div class="score" id="score-enemy">0</div>
  </div>
</div>

<canvas id="c" width="900" height="520"></canvas>

<div id="ui-bottom">
  <div id="controls-hint">
    <span><b>WASD</b> 移動</span>
    <span><b>空白</b> 傳球</span>
    <span><b>J</b> 投籃/上籃</span>
    <span><b>K</b> 搶球/防守</span>
  </div>
  <div id="diff-box">
    <span>難度：</span>
    <button class="diff-btn active" data-diff="easy">簡單</button>
    <button class="diff-btn" data-diff="medium">中度</button>
    <button class="diff-btn" data-diff="hard">困難</button>
  </div>
</div>

<div id="message-box"></div>

<div id="power-bar-wrap">
  <div id="power-label">投籃力道</div>
  <div id="power-bar-bg"><div id="power-bar"></div></div>
</div>

<!-- Main Menu Overlay -->
<div id="overlay">
  <h1>🏀 3v3</h1>
  <h2>街頭籃球</h2>
  <div style="display:flex;gap:8px;margin-bottom:24px;">
    <button class="diff-btn active" data-diff2="easy">簡單</button>
    <button class="diff-btn" data-diff2="medium">中度</button>
    <button class="diff-btn" data-diff2="hard">困難</button>
  </div>
  <button class="menu-btn" id="start-btn">開始遊戲</button>
</div>

<script>
// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const CW = 900, CH = 520;
const HOOP_R = 18;
// Court colours
const C_FLOOR  = '#c8832a';
const C_LINE   = '#fff';
const C_PAINT  = 'rgba(200,50,50,0.25)';
const C_PAINT2 = 'rgba(50,80,200,0.18)';

// Hoop positions (half-court each side)
const HOOP_L = { x: 68,  y: CH/2 };
const HOOP_R_POS = { x: CW-68, y: CH/2 };

// ─── DIFFICULTY ──────────────────────────────────────────────────────────────
const DIFF_CFG = {
  easy:   { speed:1.8, shotAcc:0.52, passAcc:0.82, defRadius:90,  react:55, shootDist:160 },
  medium: { speed:2.4, shotAcc:0.68, passAcc:0.90, defRadius:110, react:35, shootDist:190 },
  hard:   { speed:3.1, shotAcc:0.84, passAcc:0.97, defRadius:140, react:18, shootDist:230 },
};
let difficulty = 'easy';
let diffCfg = DIFF_CFG[difficulty];

// ─── CANVAS ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

// ─── GAME STATE ──────────────────────────────────────────────────────────────
let gameRunning = false;
let gameTime    = 180; // 3 minutes
let shotClock   = 24;
let shotClockTimer = 0;
let playerScore = 0;
let enemyScore  = 0;
let lastTime    = 0;
let animId      = null;

// Ball possession
// hasBall: { team:'player'|'enemy', idx:0..2 }
let ballHolder  = null;
let ballInAir   = false;
let ball        = { x: CW/2, y: CH/2, vx:0, vy:0, vy3d:0, z:0, vz:0, targetHoop:null, power:0 };
let ballFree    = true; // on ground, no one holds

// Power bar
let shootingPower = 0;
let chargingShot  = false;
let powerDir      = 1;

// Controls
const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; handleKeyDown(e); });
window.addEventListener('keyup',   e => { keys[e.key.toLowerCase()] = false; handleKeyUp(e); });

// ─── PLAYERS ─────────────────────────────────────────────────────────────────
function makePlayer(x, y, team, idx) {
  return {
    x, y, vx:0, vy:0,
    team, idx,
    radius: 16,
    speed: team === 'player' ? 3.0 : diffCfg.speed,
    hasBall: false,
    color: team === 'player' ? '#27ae60' : '#e74c3c',
    number: idx + 1,
    stamina: 100,
    aiTimer: 0,
    aiState: 'idle', // idle, offense, defense, goToball
  };
}

let players = []; // [p0,p1,p2, e0,e1,e2]

function initPlayers() {
  players = [
    // Player team (left side initially)
    makePlayer(220, CH/2,       'player', 0),
    makePlayer(200, CH/2 - 90, 'player', 1),
    makePlayer(200, CH/2 + 90, 'player', 2),
    // Enemy team (right side)
    makePlayer(680, CH/2,       'enemy', 0),
    makePlayer(700, CH/2 - 90, 'enemy', 1),
    makePlayer(700, CH/2 + 90, 'enemy', 2),
  ];
  // Player 0 starts with ball
  ballHolder  = { team:'player', idx:0 };
  ballFree    = false;
  ball.x      = players[0].x;
  ball.y      = players[0].y;
  ball.z      = 0;
  ballInAir   = false;
  controlledIdx = 0;
}

let controlledIdx = 0; // which player unit user controls

// ─── DRAW COURT ──────────────────────────────────────────────────────────────
function drawCourt() {
  // Floor
  ctx.fillStyle = C_FLOOR;
  ctx.fillRect(0, 0, CW, CH);

  // Side lines
  ctx.strokeStyle = C_LINE;
  ctx.lineWidth = 3;
  ctx.strokeRect(8, 8, CW-16, CH-16);

  // Centre line
  ctx.beginPath();
  ctx.moveTo(CW/2, 8);
  ctx.lineTo(CW/2, CH-8);
  ctx.stroke();

  // Centre circle
  ctx.beginPath();
  ctx.arc(CW/2, CH/2, 55, 0, Math.PI*2);
  ctx.stroke();

  // Left paint (key)
  ctx.fillStyle = C_PAINT;
  ctx.fillRect(8, CH/2 - 80, 160, 160);
  ctx.strokeStyle = C_LINE; ctx.lineWidth = 2;
  ctx.strokeRect(8, CH/2 - 80, 160, 160);

  // Left 3pt arc
  ctx.beginPath();
  ctx.arc(HOOP_L.x, HOOP_L.y, 195, -Math.PI*0.68, Math.PI*0.68);
  ctx.moveTo(8, CH/2 - 130);
  ctx.lineTo(8 + 55, CH/2 - 130);
  ctx.moveTo(8, CH/2 + 130);
  ctx.lineTo(8 + 55, CH/2 + 130);
  ctx.strokeStyle = C_LINE; ctx.lineWidth = 2;
  ctx.stroke();

  // Right paint
  ctx.fillStyle = C_PAINT2;
  ctx.fillRect(CW-168, CH/2 - 80, 160, 160);
  ctx.strokeStyle = C_LINE; ctx.lineWidth = 2;
  ctx.strokeRect(CW-168, CH/2 - 80, 160, 160);

  // Right 3pt arc
  ctx.beginPath();
  ctx.arc(HOOP_R_POS.x, HOOP_R_POS.y, 195, Math.PI*0.32, Math.PI*1.68);
  ctx.moveTo(CW-8, CH/2 - 130);
  ctx.lineTo(CW-8-55, CH/2 - 130);
  ctx.moveTo(CW-8, CH/2 + 130);
  ctx.lineTo(CW-8-55, CH/2 + 130);
  ctx.stroke();

  // Draw hoops
  drawHoop(HOOP_L);
  drawHoop(HOOP_R_POS);
}

function drawHoop(h) {
  // backboard
  ctx.fillStyle = '#ddd';
  const bx = h.x === HOOP_L.x ? h.x - 12 : h.x + 12;
  ctx.fillRect(bx - (h.x === HOOP_L.x ? 4 : 0), h.y - 24, 4, 48);

  // rim
  ctx.beginPath();
  ctx.arc(h.x, h.y, HOOP_R, 0, Math.PI*2);
  ctx.strokeStyle = '#e44';
  ctx.lineWidth = 3;
  ctx.stroke();

  // net lines
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1;
  for (let a = 0; a < 8; a++) {
    const ang = (a / 8) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(h.x + Math.cos(ang)*HOOP_R, h.y + Math.sin(ang)*HOOP_R);
    ctx.lineTo(h.x + Math.cos(ang)*8, h.y + Math.sin(ang)*8 + 18);
    ctx.stroke();
  }
}

// ─── DRAW PLAYERS ────────────────────────────────────────────────────────────
function drawPlayers() {
  for (let i = 0; i < players.length; i++) {
    const p = players[i];
    const isControlled = (p.team === 'player' && i === controlledIdx);
    const hasBall = ballHolder && ballHolder.team === p.team && ballHolder.idx === p.idx;

    // Shadow
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + p.radius - 2, p.radius, 6, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fill();

    // Body
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.fill();

    // Controlled highlight
    if (isControlled) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI*2);
      ctx.strokeStyle = '#ffe040';
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    // Jersey number
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${p.radius}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.number, p.x, p.y);

    // Ball indicator above head
    if (hasBall && !ballInAir) {
      ctx.fillStyle = '#f4a020';
      ctx.beginPath();
      ctx.arc(p.x, p.y - p.radius - 8, 6, 0, Math.PI*2);
      ctx.fill();
    }
  }
}

// ─── DRAW BALL ───────────────────────────────────────────────────────────────
function drawBall() {
  if (!ballInAir && !ballFree && ballHolder) return; // drawn as dot above holder
  const bz = ball.z;
  const scale = 1 + bz * 0.018;
  const r = 9 * scale;
  // shadow
  ctx.beginPath();
  ctx.ellipse(ball.x, ball.y + 10, r * 1.2, r * 0.4, 0, 0, Math.PI*2);
  ctx.fillStyle = `rgba(0,0,0,${0.35 - bz*0.008})`;
  ctx.fill();
  // ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y - bz * 0.5, r, 0, Math.PI*2);
  const grad = ctx.createRadialGradient(ball.x - r*0.3, ball.y - bz*0.5 - r*0.3, r*0.1, ball.x, ball.y - bz*0.5, r);
  grad.addColorStop(0, '#f9c74f');
  grad.addColorStop(0.6, '#f4a020');
  grad.addColorStop(1, '#c07010');
  ctx.fillStyle = grad;
  ctx.fill();
  // seams
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y - bz*0.5, r, -0.4, Math.PI + 0.4);
  ctx.stroke();
}

// ─── DRAW ARROW (pass target) ─────────────────────────────────────────────
let passTargetIdx = -1;
function drawPassArrow() {
  if (!ballHolder || ballHolder.team !== 'player') return;
  const holder = getPlayerObj(ballHolder);
  if (!holder) return;
  // find nearest teammate
  let best = -1, bestD = 9999;
  for (let i = 0; i < 3; i++) {
    if (i === controlledIdx) continue;
    const p = players[i];
    const d = dist(holder, p);
    if (d < bestD) { bestD = d; best = i; }
  }
  passTargetIdx = best;
  if (best < 0) return;
  const tp = players[best];
  ctx.save();
  ctx.setLineDash([6, 4]);
  ctx.strokeStyle = 'rgba(255,255,100,0.6)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(holder.x, holder.y);
  ctx.lineTo(tp.x, tp.y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

// ─── DRAW SHOOT INDICATOR ────────────────────────────────────────────────────
function drawShootIndicator() {
  if (!chargingShot) return;
  const holder = getPlayerObj(ballHolder);
  if (!holder) return;
  const hoop = getAttackHoop('player');
  const d = dist(holder, hoop);
  // arc showing range
  const accuracy = calcShotAccuracy(d, 'player');
  ctx.beginPath();
  ctx.arc(holder.x, holder.y, d, 0, Math.PI*2);
  ctx.strokeStyle = `rgba(255,200,0,${0.15 + accuracy*0.2})`;
  ctx.lineWidth = 1;
  ctx.stroke();
}

// ─── POWER BAR ───────────────────────────────────────────────────────────────
const pwWrap = document.getElementById('power-bar-wrap');
const pwBar  = document.getElementById('power-bar');

function updatePowerBarUI() {
  if (chargingShot) {
    pwWrap.style.display = 'flex';
    pwBar.style.width = shootingPower + '%';
  } else {
    pwWrap.style.display = 'none';
  }
}

// ─── UI HELPERS ──────────────────────────────────────────────────────────────
function updateScoreUI() {
  document.getElementById('score-player').textContent = playerScore;
  document.getElementById('score-enemy').textContent  = enemyScore;
}

function updateTimerUI() {
  const m = Math.floor(gameTime / 60);
  const s = Math.floor(gameTime % 60).toString().padStart(2,'0');
  document.getElementById('timer').textContent = `${m}:${s}`;
  document.getElementById('shot-num').textContent = Math.ceil(shotClock);
}

let msgTimeout = null;
function showMsg(text, color='#f4a020') {
  const el = document.getElementById('message-box');
  el.textContent = text;
  el.style.color = color;
  el.style.borderColor = color;
  el.style.opacity = '1';
  clearTimeout(msgTimeout);
  msgTimeout = setTimeout(() => { el.style.opacity = '0'; }, 1800);
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function getPlayerObj(ref) {
  if (!ref) return null;
  const offset = ref.team === 'player' ? 0 : 3;
  return players[offset + ref.idx];
}

function getAttackHoop(team) {
  // player attacks right hoop, enemy attacks left
  return team === 'player' ? HOOP_R_POS : HOOP_L;
}

function getDefendHoop(team) {
  return team === 'player' ? HOOP_L : HOOP_R_POS;
}

function is3Pointer(shooterX, shooterY, team) {
  const hoop = getAttackHoop(team);
  return dist({x:shooterX, y:shooterY}, hoop) > 195;
}

// ─── SHOT ACCURACY ───────────────────────────────────────────────────────────
function calcShotAccuracy(d, team) {
  const base = team === 'player' ? 0.78 : diffCfg.shotAcc;
  // distance penalty
  const penalty = Math.max(0, (d - 100) / 400);
  return clamp(base - penalty, 0.1, 0.98);
}

// ─── SHOOTING ────────────────────────────────────────────────────────────────
function shootBall(shooterRef, powerPct) {
  const shooter = getPlayerObj(shooterRef);
  const hoop    = getAttackHoop(shooterRef.team);
  const d       = dist(shooter, hoop);
  const acc     = calcShotAccuracy(d, shooterRef.team);
  const three   = is3Pointer(shooter.x, shooter.y, shooterRef.team);

  ballHolder = null;
  ballFree   = false;
  ballInAir  = true;
  ball.x     = shooter.x;
  ball.y     = shooter.y;

  // Optimal power ~60-70%
  const optPow = 0.65;
  const powErr  = Math.abs(powerPct/100 - optPow) * 0.6;
  const hitRoll = Math.random() < (acc - powErr);

  if (hitRoll) {
    // Shoot to hoop
    ball.targetHoop = { x: hoop.x, y: hoop.y, made: true, three, shooter: {...shooterRef} };
  } else {
    // Miss — offset
    const ang  = Math.atan2(hoop.y - shooter.y, hoop.x - shooter.x);
    const off  = (Math.random() - 0.5) * 80;
    ball.targetHoop = {
      x: hoop.x + Math.cos(ang + Math.PI/2)*off,
      y: hoop.y + Math.sin(ang + Math.PI/2)*off + (Math.random()-0.5)*40,
      made: false, three, shooter: {...shooterRef}
    };
  }

  // Calc velocity for arc
  const dx = ball.targetHoop.x - ball.x;
  const dy = ball.targetHoop.y - ball.y;
  const tFlight = 38; // frames
  ball.vx = dx / tFlight;
  ball.vy = dy / tFlight;
  ball.vz = 14;
  ball.z  = 0;
  ball._flight = tFlight;
  ball._flightLeft = tFlight;
}

function passBall(fromRef, toIdx) {
  const from = getPlayerObj(fromRef);
  const to   = players[toIdx];
  if (!to) return;

  ballHolder = null;
  ballFree   = false;
  ballInAir  = false; // pass is ground-level for now
  // Actually let's do a quick aerial pass
  ball.x  = from.x;
  ball.y  = from.y;
  ball.z  = 0;

  const dx = to.x - from.x;
  const dy = to.y - from.y;
  const d  = Math.hypot(dx, dy);
  const speed = 9;
  ball.vx = dx / d * speed;
  ball.vy = dy / d * speed;
  ball.vz = 3;
  ball._passTarget = { team: fromRef.team, idx: toIdx % 3 };
  ball._passDist   = d;
  ball._passTravelled = 0;
  ballInAir = true;
  ball._flight = -1; // pass mode
  ball._flightLeft = -1;
  ball.targetHoop = null;
}

// ─── BALL PHYSICS ─────────────────────────────────────────────────────────────
function updateBall(dt) {
  if (!ballInAir) {
    if (!ballFree && ballHolder) {
      const h = getPlayerObj(ballHolder);
      if (h) { ball.x = h.x; ball.y = h.y; }
    }
    return;
  }

  // Pass mode
  if (ball._passTarget) {
    const d = Math.hypot(ball.vx, ball.vy);
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.z = Math.max(0, ball.z + ball.vz);
    ball.vz -= 0.4;
    ball._passTravelled += d;

    // Check catch
    const target = players[ball._passTarget.team === 'player' ? ball._passTarget.idx : ball._passTarget.idx + 3];
    if (target && dist(ball, target) < 32) {
      catchBall(ball._passTarget);
      ball._passTarget = null;
    }
    // Loose ball check
    if (ball.z <= 0 && !ball._passTarget) { ball.z = 0; }
    if (ball.z < 0) {
      ball.z = 0;
      if (ball._passTarget) {
        // dropped — free ball
        dropBall();
      }
    }
    return;
  }

  // Shot arc
  if (ball._flightLeft > 0) {
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.z += ball.vz;
    ball.vz -= 28 / ball._flight; // gravity
    ball._flightLeft--;

    if (ball._flightLeft <= 0) {
      // Arrived
      ball.x = ball.targetHoop.x;
      ball.y = ball.targetHoop.y;
      ball.z = 0;
      ballInAir = false;

      if (ball.targetHoop.made) {
        // Score!
        const pts = ball.targetHoop.three ? 3 : 2;
        if (ball.targetHoop.shooter.team === 'player') {
          playerScore += pts;
          showMsg(pts === 3 ? '🔥 三分球！+3' : '✅ 得分！+2', '#f4a020');
          resetAfterScore('player');
        } else {
          enemyScore += pts;
          showMsg(pts === 3 ? '對手三分！' : '對手得分！', '#e44');
          resetAfterScore('enemy');
        }
        updateScoreUI();
      } else {
        // Rebound
        ballFree = true;
        ballHolder = null;
        ball.vx = (Math.random()-0.5)*3;
        ball.vy = (Math.random()-0.5)*3;
        showMsg('籃板！', '#adf');
      }
      return;
    }
  }

  // Bounce if free
  if (ballFree) {
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.vx *= 0.96;
    ball.vy *= 0.96;
    if (ball.x < 20)  { ball.x = 20;  ball.vx *= -0.6; }
    if (ball.x > CW-20){ ball.x = CW-20; ball.vx *= -0.6; }
    if (ball.y < 20)  { ball.y = 20;  ball.vy *= -0.6; }
    if (ball.y > CH-20){ ball.y = CH-20; ball.vy *= -0.6; }
  }
}

function catchBall(ref) {
  ballHolder  = { team: ref.team, idx: ref.idx };
  ballInAir   = false;
  ballFree    = false;
  ball._passTarget = null;
  ball.z = 0;
  shotClock = 24;
  if (ref.team === 'player') controlledIdx = ref.idx;
}

function dropBall() {
  ball._passTarget = null;
  ballFree   = true;
  ballHolder = null;
  ballInAir  = true;
  ball.vx = (Math.random()-0.5)*4;
  ball.vy = (Math.random()-0.5)*4;
  ball.vz = 2;
  ball.z  = 0;
}

// ─── PICKUP (free ball) ───────────────────────────────────────────────────────
function checkPickup() {
  if (!ballFree) return;
  for (let i = 0; i < players.length; i++) {
    const p = players[i];
    if (dist(p, ball) < p.radius + 12) {
      ballHolder  = { team: p.team, idx: p.idx };
      ballFree    = false;
      ballInAir   = false;
      ball.vx = 0; ball.vy = 0;
      if (p.team === 'player') {
        controlledIdx = p.idx;
        showMsg('搶到球！');
      }
      shotClock = 24;
      return;
    }
  }
}

// ─── PLAYER MOVEMENT ─────────────────────────────────────────────────────────
function updatePlayerMovement(dt) {
  const p = players[controlledIdx];
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup'])    dy -= 1;
  if (keys['s'] || keys['arrowdown'])  dy += 1;
  if (keys['a'] || keys['arrowleft'])  dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  if (dx !== 0 || dy !== 0) {
    const len = Math.hypot(dx, dy);
    p.x += (dx/len) * p.speed;
    p.y += (dy/len) * p.speed;
  }
  p.x = clamp(p.x, 20, CW-20);
  p.y = clamp(p.y, 20, CH-20);
}

// ─── TEAMMATE AI ──────────────────────────────────────────────────────────────
function updateTeammateAI(dt) {
  for (let i = 0; i < 3; i++) {
    if (i === controlledIdx) continue;
    const p = players[i];
    p.aiTimer -= dt;

    const hasBall2 = ballHolder && ballHolder.team === 'player' && ballHolder.idx === i;
    if (hasBall2) {
      // Move toward hoop slowly
      const hoop = getAttackHoop('player');
      moveToward(p, hoop, 1.8);
      return;
    }

    // Spread on court
    const targets = [
      { x: 350, y: CH/2 - 120 },
      { x: 350, y: CH/2 + 120 },
      { x: 500, y: CH/2 },
    ];
    const t = targets[i];
    if (dist(p, t) > 20) moveToward(p, t, 1.8);
  }
}

function moveToward(p, target, spd) {
  const dx = target.x - p.x;
  const dy = target.y - p.y;
  const d  = Math.hypot(dx, dy);
  if (d < 2) return;
  p.x += (dx/d) * spd;
  p.y += (dy/d) * spd;
  p.x = clamp(p.x, 20, CW-20);
  p.y = clamp(p.y, 20, CH-20);
}

// ─── ENEMY AI ─────────────────────────────────────────────────────────────────
let enemyAiTimer = 0;

function updateEnemyAI(dt) {
  enemyAiTimer -= dt;
  const spd = diffCfg.speed;

  // Find enemy with ball
  let ballCarrierIdx = -1;
  if (ballHolder && ballHolder.team === 'enemy') ballCarrierIdx = ballHolder.idx;

  for (let i = 0; i < 3; i++) {
    const p = players[3 + i];
    const isCarrier = (i === ballCarrierIdx);

    if (isCarrier) {
      // Carrier: move toward player hoop, try to shoot
      const hoop = getAttackHoop('enemy');
      const d    = dist(p, hoop);
      if (d < diffCfg.shootDist && enemyAiTimer <= 0) {
        // Try shot
        shootBall({ team:'enemy', idx:i }, 65);
        enemyAiTimer = diffCfg.react / 10;
        return;
      }
      // Try to pass if player is close
      const closestPlayer = closestPlayerTo(p, 'player');
      if (closestPlayer && dist(p, closestPlayer) < diffCfg.defRadius && Math.random() < 0.02) {
        // pass to teammate
        const mate = bestPassTarget('enemy', i);
        if (mate >= 0) {
          passBall({ team:'enemy', idx:i }, 3 + mate);
          return;
        }
      }
      moveToward(p, hoop, spd);
    } else if (ballCarrierIdx >= 0) {
      // Support run — spread to open positions
      const support = [
        { x: 650, y: CH/2 - 110 },
        { x: 720, y: CH/2 + 110 },
        { x: 600, y: CH/2 },
      ];
      moveToward(p, support[i], spd * 0.8);
    } else {
      // Defense / go to ball
      if (ballFree) {
        moveToward(p, ball, spd);
      } else if (ballHolder && ballHolder.team === 'player') {
        // Defend: go to mark a player or ball
        const mark = players[i]; // mark same-index player
        const target = i === 0
          ? getPlayerObj(ballHolder)
          : players[i];
        if (mark && dist(p, target) > 30) {
          moveToward(p, {
            x: target.x + (p.x > target.x ? 30 : -30),
            y: target.y
          }, spd);
        }
        // Steal attempt
        if (ballHolder.team === 'player' && enemyAiTimer <= 0) {
          const holderP = getPlayerObj(ballHolder);
          if (holderP && dist(p, holderP) < 28) {
            const stealChance = diffCfg.shotAcc * 0.25;
            if (Math.random() < stealChance) {
              // Steal!
              dropBall();
              ballFree = true;
              showMsg('被搶球了！', '#e44');
              enemyAiTimer = 1.0;
            }
          }
        }
      }
    }
  }

  if (enemyAiTimer <= 0) enemyAiTimer = diffCfg.react / 1000;
}

function closestPlayerTo(p, team) {
  let best = null, bestD = 9999;
  const offset = team === 'player' ? 0 : 3;
  for (let i = 0; i < 3; i++) {
    const d = dist(p, players[offset + i]);
    if (d < bestD) { bestD = d; best = players[offset + i]; }
  }
  return best;
}

function bestPassTarget(team, selfIdx) {
  let best = -1, bestScore = -1;
  for (let i = 0; i < 3; i++) {
    if (i === selfIdx) continue;
    const p = players[team === 'player' ? i : 3 + i];
    const hoop = getAttackHoop(team);
    const score = 1000 - dist(p, hoop);
    if (score > bestScore) { bestScore = score; best = i; }
  }
  return best;
}

// ─── STEAL / DEFENSE ─────────────────────────────────────────────────────────
function handleKeyDown(e) {
  if (!gameRunning) return;
  const k = e.key.toLowerCase();

  // Pass
  if (k === ' ') {
    e.preventDefault();
    if (ballHolder && ballHolder.team === 'player' && ballHolder.idx === controlledIdx) {
      // Find best teammate
      const mate = bestPassTarget('player', controlledIdx);
      if (mate >= 0) {
        passBall(ballHolder, mate);
        controlledIdx = mate;
      }
    }
  }

  // Shoot — start charging
  if (k === 'j') {
    if (ballHolder && ballHolder.team === 'player' && ballHolder.idx === controlledIdx) {
      chargingShot = true;
      shootingPower = 0;
      powerDir = 1;
    }
  }

  // Steal / switch
  if (k === 'k') {
    // Switch to nearest player without ball
    if (!ballHolder || ballHolder.team !== 'player') {
      // Try grab free ball
      if (ballFree) {
        // no-op, will pick up via proximity
      }
    } else if (ballHolder.team === 'player') {
      // Try to dribble past — no-op for now
    }
    // Switch controlled player
    let bestI = controlledIdx, bestD2 = 9999;
    for (let i = 0; i < 3; i++) {
      if (i === controlledIdx) continue;
      const p = players[i];
      const holderP = getPlayerObj(ballHolder);
      const target = ballFree ? ball : (holderP || ball);
      const d = dist(p, target);
      if (d < bestD2) { bestD2 = d; bestI = i; }
    }
    controlledIdx = bestI;
  }
}

function handleKeyUp(e) {
  const k = e.key.toLowerCase();
  if (k === 'j' && chargingShot) {
    // Release shoot
    chargingShot = false;
    if (ballHolder && ballHolder.team === 'player' && ballHolder.idx === controlledIdx) {
      shootBall(ballHolder, shootingPower);
    }
    shootingPower = 0;
    pwWrap.style.display = 'none';
  }
}

// ─── SHOT CLOCK ───────────────────────────────────────────────────────────────
function updateShotClock(dt) {
  if (!ballHolder) return;
  shotClock -= dt;
  if (shotClock <= 0) {
    shotClock = 24;
    showMsg('投籃時限！換球！', '#e44');
    // Turnover
    if (ballHolder.team === 'player') {
      dropBall();
      ball.vx = 3; ball.vy = 0;
    } else {
      dropBall();
      ball.vx = -3; ball.vy = 0;
    }
    ballFree = true;
    ballHolder = null;
  }
}

// ─── RESET AFTER SCORE ───────────────────────────────────────────────────────
function resetAfterScore(scorerTeam) {
  ballFree = false;
  ballInAir = false;
  ball.z = 0;
  ball.vx = 0; ball.vy = 0; ball.vz = 0;
  ball.targetHoop = null;
  // Loser team gets ball from their own hoop
  const inboundTeam = scorerTeam === 'player' ? 'enemy' : 'player';
  const hoop = getDefendHoop(inboundTeam);
  ball.x = hoop.x + (inboundTeam === 'player' ? 80 : -80);
  ball.y = hoop.y;
  ballHolder = { team: inboundTeam, idx: 0 };
  if (inboundTeam === 'player') controlledIdx = 0;
  shotClock = 24;
  // Reposition players
  const pTargets = [
    { x: 250, y: CH/2 },
    { x: 220, y: CH/2 - 90 },
    { x: 220, y: CH/2 + 90 },
  ];
  const eTargets = [
    { x: 650, y: CH/2 },
    { x: 680, y: CH/2 - 90 },
    { x: 680, y: CH/2 + 90 },
  ];
  for (let i = 0; i < 3; i++) {
    players[i].x = pTargets[i].x;
    players[i].y = pTargets[i].y;
    players[3+i].x = eTargets[i].x;
    players[3+i].y = eTargets[i].y;
  }
}

// ─── POWER CHARGE ────────────────────────────────────────────────────────────
function updatePowerCharge(dt) {
  if (!chargingShot) return;
  shootingPower += powerDir * dt * 80;
  if (shootingPower >= 100) { shootingPower = 100; powerDir = -1; }
  if (shootingPower <= 0)   { shootingPower = 0;   powerDir =  1; }
  updatePowerBarUI();
}

// ─── GAME OVER ────────────────────────────────────────────────────────────────
function endGame() {
  gameRunning = false;
  cancelAnimationFrame(animId);
  const ov = document.getElementById('overlay');
  const winner = playerScore > enemyScore ? '🏆 你贏了！' : playerScore < enemyScore ? '😤 對手獲勝' : '🤝 平局！';
  const wcolor = playerScore > enemyScore ? '#f4a020' : playerScore < enemyScore ? '#e44' : '#fff';
  ov.innerHTML = `
    <h1 style="color:${wcolor}">${winner}</h1>
    <div class="big-score"><span class="s1">${playerScore}</span> : <span class="s2">${enemyScore}</span></div>
    <div style="display:flex;gap:8px;margin-bottom:20px;">
      <button class="diff-btn ${difficulty==='easy'?'active':''}" data-diff2="easy">簡單</button>
      <button class="diff-btn ${difficulty==='medium'?'active':''}" data-diff2="medium">中度</button>
      <button class="diff-btn ${difficulty==='hard'?'active':''}" data-diff2="hard">困難</button>
    </div>
    <button class="menu-btn" id="start-btn">再玩一局</button>
  `;
  ov.style.display = 'flex';
  bindOverlayButtons();
}

// ─── MAIN LOOP ───────────────────────────────────────────────────────────────
function loop(ts) {
  if (!gameRunning) return;
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;

  // Game clock
  gameTime -= dt;
  if (gameTime <= 0) { gameTime = 0; updateTimerUI(); endGame(); return; }

  updateShotClock(dt);
  updateTimerUI();

  // Player input
  updatePlayerMovement(dt);
  updateTeammateAI(dt);
  updateEnemyAI(dt);
  updateBall(dt);
  updatePowerCharge(dt);
  checkPickup();

  // Draw
  ctx.clearRect(0, 0, CW, CH);
  drawCourt();
  drawPassArrow();
  drawShootIndicator();
  drawPlayers();
  drawBall();

  animId = requestAnimationFrame(loop);
}

// ─── START GAME ───────────────────────────────────────────────────────────────
function startGame() {
  playerScore = 0;
  enemyScore  = 0;
  gameTime    = 180;
  shotClock   = 24;
  chargingShot = false;
  shootingPower = 0;
  ballInAir   = false;
  ballFree    = false;
  ball._passTarget = null;
  ball.targetHoop  = null;
  diffCfg = DIFF_CFG[difficulty];
  updateScoreUI();
  initPlayers();
  document.getElementById('overlay').style.display = 'none';
  gameRunning = true;
  lastTime = performance.now();
  animId = requestAnimationFrame(loop);
}

// ─── DIFFICULTY BUTTONS ──────────────────────────────────────────────────────
function bindDiffButtons() {
  document.querySelectorAll('[data-diff]').forEach(btn => {
    btn.addEventListener('click', () => {
      difficulty = btn.dataset.diff;
      diffCfg = DIFF_CFG[difficulty];
      document.querySelectorAll('[data-diff]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
}

function bindOverlayButtons() {
  document.querySelectorAll('[data-diff2]').forEach(btn => {
    btn.addEventListener('click', () => {
      difficulty = btn.dataset.diff2;
      diffCfg = DIFF_CFG[difficulty];
      document.querySelectorAll('[data-diff2]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
  const sb = document.getElementById('start-btn');
  if (sb) sb.addEventListener('click', startGame);
}

bindDiffButtons();
bindOverlayButtons();

// Initial court draw
drawCourt();
</script>
